apiVersion: apps/v1
kind: Deployment
metadata:
  name: careconnect-frontend
  labels:
    app: careconnect
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careconnect
      tier: frontend
  template:
    metadata:
      labels:
        app: careconnect
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: careconnect-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
