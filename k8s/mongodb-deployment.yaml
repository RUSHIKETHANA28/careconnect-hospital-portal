apiVersion: apps/v1
kind: Deployment
metadata:
  name: careconnect-mongodb
  labels:
    app: careconnect
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careconnect
      tier: database
  template:
    metadata:
      labels:
        app: careconnect
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          emptyDir: {}
